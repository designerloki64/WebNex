name: Python syntax check
on:
  push:
    paths:
      - 'free_ecom_icp_lead_finder.py'
      - 'requirements.txt'
      - '.github/workflows/python-check.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m py_compile free_ecom_icp_lead_finder.py
